name: deploy-demo-pages

on:
  push:
    branches:
      - showcase
    paths:
      - ".github/workflows/pages.yml"
      - "web_app/frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out showcase
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web_app/frontend
        run: npm ci

      - name: Build static Demo Page
        working-directory: web_app/frontend
        env:
          VITE_STATIC_DEMO: "true"
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_app/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
